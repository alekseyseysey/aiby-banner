<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate">
    <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>AIBY Banner</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
</head>
<body>
<div class="wrapper">
    <div class="content">
            <div class="crossWrapper">
                <a href="#">
                <div class="exitCross"></div>
                </a>
            </div>
            <div class="titleWrapper">
                <div class="title" data-i18n="Get Unlimited <br>Access">
                </div>
            </div>
        <div class="featuresWrapper">
            <div id="featuresFirst" class="features">
                <div class="featuresText"  data-i18n='Unlimited Art <br>Creation'>

                </div>
            </div>
            <div id="featuresSecond" class="features">
                <div class="featuresText"  data-i18n='Exclusive <br>Styles'>

                </div>
            </div>
            <div id="featuresThird" class="features">
                <div class="featuresText"  data-i18n='Magic Avatars <br>With 20% Off'>
                </div>
            </div>
        </div>


            <div class="buttonsWrapper">
                <div class="buttonFirstWrapper">
                    <div class="buttonFirstContainer buttonFirstContainerBefore" id="buttonFirstContainer">
                        <div class="buttonFirsMainTextWrapper">
                            <div class="buttonFirstMainTextTitle"  data-i18n='YEARLY ACCESS'>
                            </div>
                            <div class="buttonFirstMainSecondTextPrice"  data-i18n='Just {{price}} per year'>
                            </div>
                        </div>
                        <div class="buttonFirstTextPrice"  data-i18n='{{price}} <br>per week'>
                        </div>
                        <div class="buttonFirstBestOffer"  data-i18n='BEST OFFER'>
                        </div>
                    </div>
                </div>
                <div class="buttonSecondWrapper">
                    <div class="buttonFirstContainer" id="buttonSecondContainer">
                        <div class="buttonFirsMainTextWrapper" id="buttonSecondMainTextWrapper">
                            <div class="buttonFirstMainTextTitle"  data-i18n='WEEKLY ACCESS'>
                            </div>
                        </div>
                        <div class="buttonFirstTextPrice"  data-i18n='{{price}} <br>per week'>
                        </div>
                    </div>
                </div>
            </div>
        <div class="buttonContinueWrapper">
                <a href="#" class="buttonContinueText"  data-i18n='Continue'>
                </a>
        </div>
        <div class="footerWrapper">
            <div class="footer">
                <div class="linksContainer">
                    <a href="#" class="link"  data-i18n='Terms of Use'>
                    </a>
                </div>
                <div class="linksContainer">
                    <a href="#" class="link"  data-i18n='Privacy Policy'>
                    </a>
                </div>
                <div class="linksContainer">
                    <a href="#" class="link"  data-i18n='Restore'>
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="./js/lang.js"></script>
<script src="./js/main.js"></script>
</body>
</html>
